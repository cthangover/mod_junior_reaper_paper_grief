jrp/investigation/evidence/body/name=Акт осмотра тела
jrp/investigation/evidence/body/desc=Внешних ран и следов борьбы нет. Оружие в ножнах. Признаки возможной интоксикации требуют проверки по остальным уликам.
jrp/investigation/evidence/bottles/name=Рыночные пробки и чек
jrp/investigation/evidence/bottles/desc=Клеймо рыночной лавки, две даты покупок и суммы ниже таверных. Материалы подтверждают, что Глеб пил у мельницы несколько дней.
jrp/investigation/evidence/note/name=Копия уведомления и записки
jrp/investigation/evidence/note/desc=Уведомление об удержании на содержание ребёнка и записка Миши: «Папа, ты придёшь?» Копия сохранена до восстановления стражника.
