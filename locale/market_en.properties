jrp/market/potatoes/name=Shopper
jrp/market/potatoes/0=Oh, fresh young potatoes…
jrp/market/potatoes/0/after=Bought old ones yesterday. They still look displeased.
jrp/market/potatoes/1=I could get some dill.
jrp/market/potatoes/1/after=Then I would need sour cream too.
jrp/market/potatoes/2=Give me a crooked carrot.
jrp/market/potatoes/2/after=The children spot the straight ones in soup.
jrp/market/potatoes/3=Soft tomatoes. Are they ripe?
jrp/market/potatoes/3/after=Or has someone been persuading them for too long?
jrp/market/potatoes/4=I will get cabbage on the way back.
jrp/market/potatoes/4/after=Let it carry its own weight for now.
jrp/market/potatoes/5=There is salt at home. Onions too.
jrp/market/potatoes/5/after=Why does dinner still require a trip to market?
jrp/market/potatoes/6=More string than parsley in this bunch.
jrp/market/potatoes/6/after=Do you at least take the string back?
jrp/market/potatoes/7=My neighbour said to buy at the far stall.
jrp/market/potatoes/7/after=She is still bargaining at the near one.
jrp/market/potatoes/8=Good apples. Rather small.
jrp/market/potatoes/8/after=Less guilt when you reach for the third one.
jrp/market/potatoes/9=One more round, then home.
jrp/market/potatoes/9/after=That was my decision on the last round too.
jrp/market/prices/name=Bargain hunter
jrp/market/prices/0=Is that the price for a sack?
jrp/market/prices/0/after=Oh. A handful. I see.
jrp/market/prices/1=Any discount on the cabbage?
jrp/market/prices/1/after=It still remembers yesterday’s price.
jrp/market/prices/2=Cheaper at the next stall.
jrp/market/prices/2/after=Admittedly, all they have is the stall.
jrp/market/prices/3=I am not bargaining. Just checking.
jrp/market/prices/3/after=Checked several times. Same price.
jrp/market/prices/4=Local mushrooms?
jrp/market/prices/4/after=Priced as if they walked here from the capital.
jrp/market/prices/5=How much for an empty basket?
jrp/market/prices/5/after=I certainly cannot fill it today.
jrp/market/prices/6=Does that beetroot come with a receipt?
jrp/market/prices/6/after=I would like to explain the expense at home.
jrp/market/prices/7=Could you weigh it without the weights?
jrp/market/prices/7/after=Yours look rather well fed.
jrp/market/prices/8=Another round to compare prices.
jrp/market/prices/8/after=Last time they rose while I was comparing.
jrp/market/prices/9=Fine. One onion.
jrp/market/prices/9/after=No wrapping. Packaging would ruin me.
jrp/market/bread/name=Man with groceries
jrp/market/bread/0=Only came out for bread.
jrp/market/bread/0/after=Why is my bag full again?
jrp/market/bread/1=I will take the alley home.
jrp/market/bread/1/after=At least nobody sells anything there.
jrp/market/bread/2=Warm bread. It will not make it home.
jrp/market/bread/2/after=Well, some of it will.
jrp/market/bread/3=My wife said: nothing extra.
jrp/market/bread/3/after=Does cheese count as extra when buying bread?
jrp/market/bread/4=This stall smells of pies.
jrp/market/bread/4/after=Wait. That is my bag.
jrp/market/bread/5=Could I try a piece?
jrp/market/bread/5/after=No second piece. I have not bought the first yet.
jrp/market/bread/6=The shopping list was right here.
jrp/market/bread/6/after=Now there is a herring. A sensible replacement.
jrp/market/bread/7=Passed that cheese three times. Clearly do not need it.
jrp/market/bread/7/after=A fourth pass to be certain.
jrp/market/bread/8=Home first, then back for kvass.
jrp/market/bread/8/after=No. That would mean walking twice.
jrp/market/bread/9=I will stop and count my purchases.
jrp/market/bread/9/after=One loaf. Everything else was circumstances.
