mod_junior_reaper_paper_grief_name=Junior Reaper & Paper Grief
mod_junior_reaper_paper_grief_desc=Стас умер на работе. Теперь ему выдали другую. Вступление с изометрическим офисом Бюро Некроуслуг, Смертью и первым делом.
