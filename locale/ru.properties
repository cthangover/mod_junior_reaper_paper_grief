jrp/quest/guard/name=Дело № 001 · Стражник не на посту
jrp/quest/guard/0=Получено первое поручение. Изучить дело у стола выдачи или в архиве. Затем обратиться в Бюро выездов справа от входа. Стражник столицы снова умер у старой мельницы; без него безопасная зона уязвима.
jrp/quest/guard/1=Выезд оформлен: старая мельница у столицы. Осмотреть место смерти стражника и выяснить, почему он покинул пост. Полевое расследование продолжит историю после этого наброска.
jrp/item/starter_sword/name=Стартовый меч избранного
jrp/item/starter_sword/desc=Выдан автоматически при попадании в RPG-мир. Назначение не подтверждено; подлежит изъятию.
jrp/item/claim_receipt/name=Квитанция об изъятии № 001
jrp/item/claim_receipt/desc=Меч принят на хранение Бюро Некроуслуг. Возврат — при подтверждении статуса избранного.
jrp/item/case_file/name=Дело № 001: стражник
jrp/item/case_file/desc=Повторная внеплановая смерть стражника столицы. Место: старая мельница. Без стражника безопасная зона открыта для гриферов.
