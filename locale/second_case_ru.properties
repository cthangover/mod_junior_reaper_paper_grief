jrp/case2/death/0=Смерть: Во вторник меня не ищи. Опять «Пепельная жатва». Пятьсот смертей одним пакетом.
jrp/case2/princess/4=Стас: И выйти нельзя?
jrp/case2/princess/5=Принцесса: Спасать меня можно. Отпускать — нарушение условий.
jrp/case2/princess/6=Стас: Кто условия утверждал?
jrp/case2/princess/7=Принцесса: Тот, у кого похищение длится с девяти до шести. Дракон покажет договор.
jrp/case2/death/1=Стас: Один акт на всех?
jrp/case2/death/2=Смерть: Пятьсот актов. Каждому — причина, место, подпись. Весь день. Каждую неделю.
jrp/case2/death/3=Стас: А деревня?
jrp/case2/death/4=Смерть: Три деревни. Восстановят до утра. Потом снова. У них это называется повторяемый контент.
jrp/case2/death/5=Стас: В прошлой жизни мне тоже обещали, что аврал последний. Я тогда поверил.
jrp/case2/death/6=Смерть: Хочешь шаблон? В нём уже проставлен следующий вторник.
jrp/case2/death/7=Стас: Я хочу, чтобы следующего пакета не было. Мне второй раз офисной крысой работать не за что.
jrp/case2/death/8=Смерть: Начальник скажет, что это саботаж.
jrp/case2/death/9=Стас: Пусть хоть раз правильно назовёт мою работу.
jrp/case2/death/10=Дело № 002: «Пепельная жатва». Маршрут в деревню открыт на стойке выездов. Рабочие материалы — на личном столе Стаса. В коридоре доступен профсоюз NPC.
jrp/case2/death/11=Смерть: Спроси тех, кто живёт до следующего вторника. На площади — Аглая, травница и лавочник. Прочти афишу, потом поговори с распорядителем у пещеры.
jrp/case2/death/12=Смерть: Дракон согласен судиться? У профсоюза есть юрист. Маленький, зелёный. Начальство при нём почему-то читает мелкий шрифт.
jrp/case2/death/13=Смерть: Для иска нужен текст, а не намерение. У тебя теперь свой стол. Хороший повод использовать его против работодателя.
jrp/case2/death/14=Смерть: Отнеси иск дракону. Подписывать за него нельзя. Даже если очень хочется сэкономить время.
jrp/case2/death/15=Смерть: Анонимную копию — в красный ящик профсоюза. Подписанный оригинал — юристу. Моя фамилия ни в одном из них не нужна.
jrp/case2/death/16=Смерть: Иск принят, но вторник ещё в расписании. Поговори с драконом об отказе от работы. За него это решение не примешь.
jrp/case2/death/17=Смерть: Заявление об отказе вижу. Теперь проверь сам ивент: сборный пункт у пещеры, звонок распорядителя, потом жители. Я пока не убираю пакет.
jrp/case2/death/18=Смерть: На вторник — ни одного акта. Оформи результат на своём столе, пока начальник не назначил мне пятьсот учебных смертей.
jrp/case2/death/19=Смерть: Во вторник я выключила будильник. Не пейджер. Пока только будильник.
jrp/case2/death/20=Стас: Уже нарушение регламента.
jrp/case2/death/21=Смерть: Ты дурно на меня влияешь. Поставь вторую чашку.
jrp/case2/village_intro/0=Дело № 002 · До вторника
jrp/case2/village_intro/1=Аглая: Если вы из восстановления, не ставьте мне опять дверь внутрь комнаты.
jrp/case2/village_intro/2=Стас: Я младший менеджер по реанимации.
jrp/case2/village_intro/3=Аглая: Вот и посмотрите мне колено. С прошлого вторника не сгибается.
jrp/case2/village_intro/4=Стас: Сначала спрошу про вторник. Колено в план не включаю.
jrp/case2/village_intro/5=На площади ждут Аглая, травница и лавочник. Расписание налёта висит на доске у амбара; тропа справа ведёт к сборному пункту и пещере.
jrp/case2/village_intro/6=В пропуске нет назначения на этот участок. Сначала поговорите со Смертью после закрытия первого дела.
jrp/case2/forewoman/0=Аглая: В среду кладём крышу. В четверг стеклим. К понедельнику белим. Во вторник горим. Среда — приёмка.
jrp/case2/forewoman/1=Стас: Можно уйти на время налёта?
jrp/case2/forewoman/2=Аглая: На той неделе ушли к соседям. Дракон догнал там. В ведомости не место важно, а пятьсот человек.
jrp/case2/forewoman/3=Стас: Он сам это придумал?
jrp/case2/forewoman/4=Аглая: Он на крыше мне трубу поправлял. Перед налётом извинился. А потом сжёг. Так что вы спросите и у него.
jrp/case2/forewoman/5=Аглая: Мы с соседними деревнями в одном списке. Спрятаться — не выйти из списка. Травница его каждый вторник сверяет.
jrp/case2/forewoman/6=Аглая: Крыша целая. Понимаешь? Я её сегодня просто чиню. Не восстанавливаю.
jrp/case2/forewoman/7=Стас: После сигнала ивента — все живы?
jrp/case2/forewoman/8=Аглая: Во всех трёх деревнях. Травница пересчитала. Пятьсот человек. Ноль покойников.
jrp/case2/forewoman/9=Результат подтверждён жителями: недельный сигнал прошёл, налёта не было. Вернитесь к личному столу и оформите результат.
jrp/case2/forewoman/10=Аглая: Только сначала дождись их звонка у пещеры. А то начальство скажет: ещё не вечер.
jrp/case2/healer/0=Травница: Пятьсот записей. Набор тот же, даты разные. Я уже знаю, у кого какая аллергия на посмертный бальзам.
jrp/case2/healer/1=Стас: Восстановление снимает боль?
jrp/case2/healer/2=Травница: Восстановление снимает галочку «мёртв». Всё остальное остаётся у нас.
jrp/case2/healer/3=Стас: Мне нужна копия списка без имён. Число, время и сколько раз это повторилось.
jrp/case2/healer/4=Травница: Дам. Врач наконец-то спросил по делу.
jrp/case2/healer/5=Стас: Я не врач. Ладно. Копию, пожалуйста.
jrp/case2/healer/6=Травница: Восемь вторников подряд. Каждый раз ровно пятьсот. Анонимная выписка у тебя.
jrp/case2/healer/7=Травница: Пятьсот живых. Пересчитала дважды. Второй раз — потому что никто не торопил.
jrp/case2/vendor/0=Лавочник: Пакет «После пожара»: гвозди, крупа, дверь. Постоянным погорельцам — в долг.
jrp/case2/vendor/1=Стас: Вы на этом зарабатываете?
jrp/case2/vendor/2=Лавочник: Я тоже сгораю. Долговая книга — нет. Её выдают новой сразу с прежним итогом.
jrp/case2/vendor/3=Стас: А дракон?
jrp/case2/vendor/4=Лавочник: Покупает мазь для горла. Огнём дышать велено, лечение за свой счёт. Распорядитель наверху каждый раз требует полный план.
jrp/case2/vendor/5=Лавочник: К распорядителю — по тропе справа. Попроси показать, кто подписал план. Обычно после этого люди перестают улыбаться.
jrp/case2/vendor/6=Лавочник: Дверей сегодня не продал. Сначала испугался. Потом вспомнил, что моя тоже на месте.
jrp/case2/notice/0=«Пепельная жатва». Каждый вторник. Этап первый: уничтожение населения трёх деревень, 500 единиц. Этап второй: герои освобождают принцессу. Повторное заселение включено.
jrp/case2/notice/1=Стас: Слово «люди» не поместилось. Зато «включено» жирным.
jrp/case2/notice/2=Копия расписания в деле. Пятьсот жителей — обязательное условие запуска рейда. Отмена убийств срывает первый этап, не требует убивать дракона.
jrp/case2/marshal/0=Распорядитель: Заявка на героизм? В очередь. Пока дракон не сжёг пятьсот, принцесса не считается похищенной.
jrp/case2/marshal/1=Стас: Она-то об этом знает?
jrp/case2/marshal/2=Распорядитель: Разумеется. Четырнадцатый год в штате.
jrp/case2/marshal/3=Стас: Кто обязывает дракона жечь деревни?
jrp/case2/marshal/4=Распорядитель: Приложение к трудовому договору. Я лишь звоню в колокол. Невыполнение плана — удержание жалованья и лишение гнезда.
jrp/case2/marshal/5=Стас: Копию этих условий. Заверенную.
jrp/case2/marshal/6=Распорядитель: Вы из проверки? Я же сказал — только звоню.
jrp/case2/marshal/7=Распорядитель: В пещеру можно. Только без битвы: сначала население, потом героизм. Строго по порядку.
jrp/case2/marshal/8=Распорядитель: Дракон не выходит. У меня первый этап не закрыт.
jrp/case2/marshal/9=Проверить начало следующей «Пепельной жатвы»?
jrp/case2/marshal/10=Дождаться сигнала и проверить результат
jrp/case2/marshal/11=Вернуться позже
jrp/case2/marshal/12=В назначенный вторник распорядитель звонит. Очередь героев ждёт. Из пещеры приносят заявление об отказе выполнять опасную работу.
jrp/case2/marshal/13=Распорядитель: Этап один — не выполнен. Этап два — недоступен. Может, вручную поставить пятьсот?
jrp/case2/marshal/14=Стас: Поставите — получите пятьсот свидетелей.
jrp/case2/marshal/15=После недельного сигнала дракон остался в гнезде. Налёт не состоялся. Подтвердите у Аглаи в деревне, что все жители живы.
jrp/case2/marshal/16=Распорядитель: Событие приостановлено до исполнения требований. Колокол на месте. Звонить некуда.
jrp/case2/cave_intro/0=Гнездо · служебное жильё
jrp/case2/cave_intro/1=Дракон: Если за принцессой, она пьёт чай. Если по переписи — я ещё никого.
jrp/case2/cave_intro/2=Стас: По условиям труда.
jrp/case2/cave_intro/3=Дракон: Тогда проходи. Тут лежать можно, сидеть положено только на сокровищах.
jrp/case2/dragon/0=Дракон: Пятьсот за вечер. Я учился сторожить, не жечь. Когда подписывал, деревня была в единственном числе.
jrp/case2/dragon/1=Стас: А теперь?
jrp/case2/dragon/2=Дракон: Теперь в приложении написано «с прилегающим населением». Принцессу охраняю без перерывов. Крыло лечу в отпуске, которого нет.
jrp/case2/dragon/3=Стас: Можно просто уйти?
jrp/case2/dragon/4=Дракон: Гнездо служебное. Сокровища инвентарные. За отказ — выселение и взыскание за недополученный героизм.
jrp/case2/dragon/5=Стас: Разрешишь снять копию договора? Решать за тебя я не буду. Но мелкий шрифт прочитаю.
jrp/case2/dragon/6=Дракон: Снимай. В прошлый раз читатель до мелкого шрифта не дожил. По плану.
jrp/case2/dragon/7=Условия подтверждены жителями, афишей и распорядителем.
jrp/case2/dragon/8=Предложить иск и отказ от убийств до исполнения требований
jrp/case2/dragon/9=Сначала ещё разобраться
jrp/case2/dragon/10=Стас: Подай иск. Оспорь это приложение. А пока требования не исполнят — не выходи жечь деревни. Пусть их событие стоит.
jrp/case2/dragon/11=Дракон: Мне одному против всей конторы?
jrp/case2/dragon/12=Стас: Ты, три деревни и профсоюз. Без твоего согласия я даже обложку не подпишу.
jrp/case2/dragon/13=Дракон: Хочу убрать убийства из договора. Гнездо оставить. Принцессе дать выходной. Можно такими словами?
jrp/case2/dragon/14=Стас: Начнём именно с них.
jrp/case2/dragon/15=Дракон согласен подать иск. Найдите гоблина-юриста в профсоюзе Бюро; вход — из коридора.
jrp/case2/dragon/16=Стас: Договор у меня. Теперь сверю его с рассказами Аглаи, травницы, лавочника, расписанием на доске и приказом распорядителя. Пустых обещаний больше не выдаю.
jrp/case2/dragon/17=Дракон: Юрист уже видел? Мой договор пережил шесть героев. Не хотелось бы, чтобы он пережил и нас.
jrp/case2/dragon/18=Стас: Убрать обязательные убийства. Оплатить сверхурочные и лечение. Не выселять за отказ. Отдельно — требования жителей, гоблинов и принцессы. Прочти.
jrp/case2/dragon/19=Дракон: Тут написано, что я не прошу разрешения убивать поменьше. Я требую перестать.
jrp/case2/dragon/20=Стас: Да.
jrp/case2/dragon/21=Дракон держит перо между когтями.
jrp/case2/dragon/22=Передать оригинал для добровольной подписи
jrp/case2/dragon/23=Дать ещё время прочитать
jrp/case2/dragon/24=Дракон: Подписал. Имя моё. Отказ от убийств тоже будет мой.
jrp/case2/dragon/25=Подписанный иск получен. В красный почтовый ящик профсоюза опустите только анонимную копию для огласки; оригинал отдайте юристу.
jrp/case2/dragon/26=Дракон: Подпись уже стоит. Теперь нужен входящий номер. Его нельзя выдохнуть, я пробовал.
jrp/case2/dragon/27=Иск зарегистрирован. Как остановить ближайший налёт?
jrp/case2/dragon/28=Предложить не выполнять убийственный этап до исполнения требований
jrp/case2/dragon/29=Пока не обсуждать отказ
jrp/case2/dragon/30=Стас: Иск приняли. Профсоюз разослал уведомления. Теперь ты можешь отказаться выполнять опасную работу. Не ломай мосты, не жги контору. Просто не выходи на налёт.
jrp/case2/dragon/31=Дракон: А принцесса?
jrp/case2/dragon/32=Принцесса из-за ширмы: Я тоже уведомила. Буду пить чай без похищения.
jrp/case2/dragon/33=Дракон: Тогда я отказываюсь. До исполнения требований — ни одного налёта. Если суд займёт второй квартал, значит второй квартал все будут живы.
jrp/case2/dragon/34=Дракон подписал уведомление об отказе от опасной работы. Убийственный этап еженедельного ивента остановлен. Проверьте очередной сигнал у распорядителя, затем жителей деревни.
jrp/case2/dragon/35=Дракон: Уведомление висит. Огонь только под чайником. Иск на рассмотрении, требования ещё не исполнены — на работу не выхожу.
jrp/case2/union_intro/0=Профсоюз NPC · приём без записи
jrp/case2/union_intro/1=Секретарь: Красный ящик — анонимные сообщения. Подписанные заявления — юристу. Чай — всем, кипяток закончился.
jrp/case2/union_intro/2=Стас: Они тут действительно работают?
jrp/case2/union_intro/3=Секретарь: Мы не Бюро. Нам некогда изображать.
jrp/case2/union_intro/4=Юрист Рикк принимает у дальнего стола. Сотрудники разносят письма, сортируют дела и готовят выписки. Красный ящик у входа принимает анонимные письма.
jrp/case2/union_intro/5=На двери: «Приём по служебному пропуску после первого закрытого дела».
jrp/case2/lawyer/0=Рикк: Дракон? У меня уже есть иск гоблинов к нему за неоплаченный вынос обгорелых доспехов.
jrp/case2/lawyer/1=Стас: Он тоже работает по навязанному приложению. Пятьсот жителей каждую неделю.
jrp/case2/lawyer/2=Рикк: Это его не оправдывает перед гоблинами. Но указывает, кого привлекать вторым ответчиком.
jrp/case2/lawyer/3=Стас: Возьмёшь дело?
jrp/case2/lawyer/4=Рикк: С компенсацией гоблинам, лечением дракона, безопасностью жителей и сменой принцессе. Поможешь только ему — получишь забастовку против своей забастовки.
jrp/case2/lawyer/5=Стас: Годится. Чужую усталость в расходы я уже записывал. Хватит.
jrp/case2/lawyer/6=Рикк: На своём столе составь иск. Пусть дракон прочтёт и подпишет. Для огласки сделай обезличенную копию: ящик не должен превращать свидетелей в список на увольнение.
jrp/case2/lawyer/7=Рикк: Оригинал подписан. Теперь обезличенную копию в красный ящик. Без огласки эту папку положат под ножку стола.
jrp/case2/lawyer/8=Рикк: Иск пишется у тебя в кабинете. Подпись ставится у дракона. Ящик принимает анонимную копию. Ко мне приносят оригинал. Последовательность сложная, знаю: нигде не требуется умирать.
jrp/case2/lawyer/9=Передать Рикку подписанный оригинал иска?
jrp/case2/lawyer/10=Зарегистрировать иск и уведомления об отказе от опасной работы
jrp/case2/lawyer/11=Пока оставить документы у себя
jrp/case2/lawyer/12=Рикк: Входящий № 002-Д. Приём подтверждён. Огласка опубликована без имён. Работодатель и распорядитель уведомлены.
jrp/case2/lawyer/13=Стас: Значит, уже всё?
jrp/case2/lawyer/14=Рикк: Значит, есть бумага, которую нельзя объявить несуществующей. Сам дракон ещё должен заявить отказ. Вернись к нему.
jrp/case2/lawyer/15=Иск зарегистрирован один раз. Требования ещё не исполнены; дракон может приостановить убийственную работу на время рассмотрения.
jrp/case2/lawyer/16=Рикк: № 002-Д остаётся в работе. Жители и гоблины включены. Пока требования не исполнят, мы поддерживаем отказ от налётов. Дубликат не нужен.
jrp/case2/lawyer/17=Рикк: Здесь помогают тем, кому предписано умирать по должности. Если принесёшь плановую смерть на подпись — встанешь в очередь ответчиков.
jrp/case2/mailbox/0=Почтовый ящик профсоюза. Анонимность отправителя сохраняется.
jrp/case2/mailbox/1=Оставить анонимную записку о переработках Бюро
jrp/case2/mailbox/2=Отойти
jrp/case2/mailbox/3=Стас опускает записку без подписи: «Полевая служба сокращена до одного человека. Нагрузка — за четверых». Ни номера кабинета, ни имени Смерти.
jrp/case2/mailbox/4=Секретарь забирает конверт в общую сортировку. Записка принята; это ещё не иск по делу дракона.
jrp/case2/mailbox/5=Записка о переработках уже принята. Повторная отправка не создаст ещё одного сотрудника в поле.
jrp/case2/mailbox/6=Оригинал подписан. Для огласки приготовлена отдельная копия без имён и подписей.
jrp/case2/mailbox/7=Опустить анонимное письмо о пятистах смертях каждую неделю
jrp/case2/mailbox/8=Сначала ещё проверить копию
jrp/case2/mailbox/9=В конверте — расписание ивента, число повторных смертей и выдержки из условий труда. Имён жителей, подписи дракона и источника из Бюро нет. Оригинал иска остаётся у Стаса.
jrp/case2/mailbox/10=Секретарь: Пятьсот? В недельную сводку. И копию на доску — без обратного адреса.
jrp/case2/mailbox/11=Проблема предана огласке. Передайте подписанный оригинал Рикку для регистрации иска.
jrp/case2/mailbox/12=Анонимное письмо по «Пепельной жатве» принято. Сводка опубликована. Повторная отправка не требуется.
jrp/case2/union_board/0=На доске — приёмные часы, отказы в сверхурочных и инструкция: «Анонимное сообщение можно опустить в красный ящик. Подписанный иск передаётся лично юристу».
jrp/case2/union_board/1=«Пятьсот повторных смертей каждую неделю. «Пепельная жатва»: под видом развлечения действует обязательное уничтожение жителей. Требуем остановить налёты, оплатить лечение и пересмотреть условия труда». Источник и имена свидетелей не опубликованы.
jrp/case2/union_board/2=Рядом номер дела: 002-Д. Профсоюз поддерживает отказ от опасной работы до исполнения требований.
jrp/case2/personal_desk/0=Закрытое дело Глеба лежит отдельно. По вторникам в расписании Смерти зачернен целый день. Спросите её, что за вызов повторяется каждую неделю.
jrp/case2/personal_desk/1=Дело № 002. Нужны показания Аглаи, травницы и лавочника, копия афиши и приказ распорядителя. Затем — разговор с драконом и консультация Рикка в профсоюзе.
jrp/case2/personal_desk/2=Стас: Раньше я бы сделал таблицу на пятьсот строк. Теперь пусть строк не будет.
jrp/case2/personal_desk/3=Составить иск по согласованным с Рикком требованиям?
jrp/case2/personal_desk/4=Подготовить иск и отдельное анонимное письмо для огласки
jrp/case2/personal_desk/5=Пока оставить черновик
jrp/case2/personal_desk/6=В иске: исключить обязательные убийства; оплатить сверхурочные, лечение и компенсации гоблинам; обеспечить безопасность жителей, смену принцессе и сохранение гнезда на время спора.
jrp/case2/personal_desk/7=Стас делает вторую копию — только факты и условия, без имён, подписей и служебных номеров свидетелей. Это письмо для красного ящика. Оригинал повезёт дракону на подпись.
jrp/case2/personal_desk/8=Стас: Таблицы пригодились. Только теперь в них не люди должны помещаться.
jrp/case2/personal_desk/9=Черновик иска готов. Отнесите дракону: он должен прочитать и подписать сам.
jrp/case2/personal_desk/10=Подписанный оригинал сохранён. Анонимную копию — в красный ящик профсоюза; затем оригинал — Рикку.
jrp/case2/personal_desk/11=Анонимное письмо принято. Передайте Рикку подписанный иск и получите входящий номер.
jrp/case2/personal_desk/12=Иск зарегистрирован. Поговорите с драконом об отказе от налётов до исполнения требований.
jrp/case2/personal_desk/13=Дракон отказался от налётов. Дождитесь недельного сигнала у распорядителя, затем подтвердите у Аглаи, что жители остались живы.
jrp/case2/personal_desk/14=Зафиксировано: очередной ивент прошёл без пятисот смертей. Как отправить результат начальству?
jrp/case2/personal_desk/15=Оформить приостановку по судебному спору, сохранив свидетельства
jrp/case2/personal_desk/16=Пока не отправлять отчёт
jrp/case2/personal_desk/17=Начальнику: «Повторяемый ивент приостановлен в связи с трудовым спором № 002-Д. Пакет актов не сформирован ввиду отсутствия страхового события». Подлинные показания остаются в деле.
jrp/case2/personal_desk/18=Стас: Худший сотрудник недели. Наконец-то по делу.
jrp/case2/personal_desk/19=Пейджер Смерти не требует ни одной из пятисот подписей. В её вторнике впервые свободен целый день. Иск ещё на рассмотрении; дракон продолжает отказ до исполнения требований.
jrp/case2/personal_desk/20=Смерть, из дверей: Я не на вызов. Просто зашла.
jrp/case2/personal_desk/21=Стас: Вторую чашку?
jrp/case2/personal_desk/22=Смерть: Поставь. И не пиши, на сколько минут.
jrp/case2/personal_desk/23=Дело № 002 закрыто для Бюро, трудовой спор продолжает вести профсоюз. Дракон не выполняет убийственный этап, жители живы, вторник Смерти свободен.
jrp/case2/union_door/0=Профсоюз NPC. Дверь открывается по служебному пропуску после первого закрытого дела.
jrp/case2/dispatch/0=Бюро выездов · дело № 002
jrp/case2/dispatch/1=В деревню: расследовать «Пепельную жатву»
jrp/case2/dispatch/2=В столицу: проверить первое дело
jrp/case2/dispatch/3=Остаться в Бюро
jrp/case2/quest/name=Дело № 002: Пепельная жатва
jrp/case2/quest/0=Смерть тратит каждый вторник на пятьсот актов по «Пепельной жатве». Через стойку выездов отправляйтесь в деревню.
jrp/case2/quest/1=Опросите Аглаю, травницу и лавочника. Снимите копию афиши у амбара; на горном перевале спросите распорядителя об условиях налёта.
jrp/case2/quest/2=Показания и расписание подтверждают обязательные пятьсот смертей. Войдите в пещеру, поговорите с драконом и предложите иск и отказ от убийств.
jrp/case2/quest/3=Дракон согласен судиться. Найдите гоблина-юриста Рикка в профсоюзе; дверь находится между кабинетами Смерти и Стаса.
jrp/case2/quest/4=Рикк согласовал требования. На личном столе Стаса подготовьте иск и отдельное обезличенное письмо для огласки.
jrp/case2/quest/5=Черновик готов. Дракон должен прочитать и добровольно подписать оригинал в своей пещере.
jrp/case2/quest/6=Иск подписан. Опустите отдельное анонимное письмо о еженедельных смертях в красный почтовый ящик профсоюза.
jrp/case2/quest/7=Проблема предана огласке без имён свидетелей. Передайте Рикку подписанный оригинал для регистрации.
jrp/case2/quest/8=Иск № 002-Д зарегистрирован. Вернитесь к дракону и предложите отказаться от налётов до исполнения требований.
jrp/case2/quest/9=Дракон прекратил убийства. У распорядителя дождитесь сигнала следующего ивента, затем проверьте у Аглаи, что все жители живы.
jrp/case2/quest/10=Недельный сигнал прошёл без налёта; пятьсот жителей живы. На личном столе оформите приостановку по трудовому спору.
jrp/case2/quest/11=Убийственный ивент остановлен. Иск на рассмотрении, дракон продолжает отказ до исполнения требований. Смерть получила свободный вторник.
jrp/case2/item/raid_notice/name=Копия расписания «Пепельной жатвы»
jrp/case2/item/raid_notice/desc=Каждый вторник: обязательные 500 смертей жителей трёх деревень, затем героический рейд.
jrp/case2/item/dragon_contract/name=Копия договора дракона
jrp/case2/item/dragon_contract/desc=Приложение навязывает убийства и сверхурочные, угрожает выселением из служебного гнезда.
jrp/case2/item/dragon_claim/name=Подписанный иск дракона
jrp/case2/item/dragon_claim/desc=Оригинал с добровольной подписью. Передать Рикку лично; для огласки предназначена отдельная анонимная копия.
jrp/case2/item/dragon_receipt/name=Входящий № 002-Д
jrp/case2/item/dragon_receipt/desc=Иск принят. Профсоюз уведомил работодателя и поддерживает отказ от опасной работы до исполнения требований.
jrp/case2/vendor/rewrite0=Лавочник: Вы за крупой? Берите в долг. До вторника я всё равно не откроюсь.
jrp/case2/vendor/rewrite1=Стас: Выходные?
jrp/case2/vendor/rewrite2=Лавочник: Запой. Во вторник прилетит дракон, всех убьёт. В среду воскресят — и можно по новой.
jrp/case2/vendor/rewrite3=Стас: Вас это устраивает?
jrp/case2/vendor/rewrite4=Лавочник: Дракон мешает. Самый разгар — и опять умирать. Если б не он, вообще бы жизнь наладилась.
jrp/case2/vendor/rewrite5=Стас: А если убрать налёты совсем?
jrp/case2/vendor/rewrite6=Лавочник: В смысле, до конца месяца дожить? А кто тогда долги обнулит? Хотя погоди. Долги-то не обнуляют.
jrp/case2/vendor/rewrite7=Стас: Кто дракону план выдаёт?
jrp/case2/vendor/rewrite8=Лавочник: Распорядитель наверху. Дракон к нему с мазью для горла ходил, просил перерыв. Получил ещё деревню.
