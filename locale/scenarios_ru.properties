jrp/arrival/title = Обеденный перерыв
jrp/arrival/1 = Стас: Ещё одну ячейку — и обед.
jrp/arrival/2 = Коллега: Ты уже ешь.
jrp/arrival/3 = Стас: Это параллельная задача.
jrp/arrival/4 = Куриная косточка. Вдох не получился. Таблица осталась открытой.
jrp/arrival/title2 = Новый мир. Выдача инвентаря
jrp/arrival/5 = Голос: Добро пожаловать в мир меча и магии. Ваш стартовый меч.
jrp/arrival/6 = Стас: То есть я умер. А здесь можно начать заново?
jrp/arrival/7 = Смерть: Меч сюда. В базе ошибка. Ты не Избранный.
jrp/arrival/8 = Стас: А кто?
jrp/arrival/9 = Смерть: Младший менеджер по реанимации. Квитанцию не теряй.
jrp/arrival/10 = Стас: С испытательным сроком?
jrp/arrival/11 = Смерть: Уже идёт. За мной, в офис.
jrp/office/1 = Начальник, по громкой связи: Новый сотрудник? Прекрасно. Дело № 001 — повторные смерти столичного стражника.
jrp/office/2 = Стас: Я ещё заявление не написал.
jrp/office/3 = Начальник: Заполните задним числом. В столице безопасная зона. Стражники там умирать не должны. Выясните причину.
jrp/office/4 = Смерть: Его уже пятый раз находят у старой мельницы. К воротам он так и не возвращается.
jrp/office/5 = Стас: И охрану никто не заменил?
jrp/office/6 = Смерть: Живой стражник и есть защита. Нет его — игроки могут бить местных. А собирать их потом мне.
jrp/office/7 = Стас: Сколько у тебя людей в отделе?
jrp/office/8 = Смерть: В поле? Один. Можешь пересчитать.
jrp/office/9 = Первое дело уже в сумке. Временное место Стаса — за маленьким столом в кабинете Смерти. Диспетчерская находится в коридоре Бюро.
jrp/office/controls = Ходить — WASD или стрелки. Взаимодействовать — E или F, стоя лицом к предмету или сотруднику.
jrp/office/title = Бюро · кабинет Смерти
jrp/death/opt_work = Спросить о стражнике
jrp/death/opt_time = У тебя бывает перерыв?
jrp/death/2 = Смерть: Сначала посмотри на тело. Не пиши «нападение игроков», пока не увидишь следы. В прошлый раз так и сделали.
jrp/death/5 = Смерть: Был. Пока ты спрашивал.
jrp/death/6 = Она переворачивает пейджер экраном вниз. Он продолжает мигать.
jrp/death/1 = Смерть: Если про косу — это рабочий инструмент. Меч тебе не вернут.
jrp/death/3 = Стас: Пять одинаковых строк ещё не доказательство.
jrp/death/4 = Смерть: Вот с этого и начни.
jrp/desk/1 = Дело № 001. Один и тот же стражник, пять смертей. Место обнаружения — старая мельница. Причина во всех пяти актах: «уточняется».
jrp/desk/2 = Стас: Добавлю столбец «что мы вообще знаем». Пока пустой.
jrp/desk/3 = Задача на выезд: осмотреть тело, установить причину смерти и выяснить, почему пост пустует. Регистрационная стойка отправки — в восточной части офиса.
jrp/desk/4 = Стас: Сначала мельница. Таблицу можно закончить после того, как появятся факты.
jrp/evidence/1 = На квитанции: «Меч стартовый, один. Изъят в связи с изменением карьерной траектории».
jrp/evidence/2 = Стас: А если я оспорю?
jrp/evidence/3 = Из ящика отвечает голос: «Окно обжалования закрывается при трудоустройстве».
jrp/coffee/1 = Стас: Я могу налить две чашки.
jrp/coffee/2 = Смерть: Одну. Вторую я не успею.
jrp/coffee/3 = Стас оставляет чашку на свободном краю стола. Смерть забирает её, не выпуская пейджер.
jrp/coffee/4 = Смерть: Без сахара. На будущее.
jrp/coffee/5 = Автомат: «Кофе закончился. Отчёт о потреблении готов».
jrp/dispatch/go = Зарегистрировать выезд
jrp/dispatch/stay = Сначала осмотреть офис
jrp/dispatch/1 = Диспетчер: Мельница. Повторная смерть стражника. В графе «вооружение» ставлю прочерк.
jrp/dispatch/2 = Стас: Зато у меня есть дело.
jrp/dispatch/3 = Смерть: Держи его сухим. У мельницы течёт крыша.
jrp/dispatch/end = Выезд зарегистрирован
jrp/dispatch/scope = Конец вступительного наброска. Пролог, офис и получение первого дела готовы к прохождению. Осмотр мельницы и расследование будут продолжением; сейчас можно остаться в офисе и изучить его.
jrp/dispatch/after = Выезд к старой мельнице зарегистрирован. Дело остаётся открытым: расследование в этот набросок ещё не входит.
jrp/dispatch/unbriefed = Диспетчер: Сначала получите поручение. Без номера дела вы просто гуляете в рабочее время.
jrp/dispatch/ask = Отправка по делу № 001: старая мельница
