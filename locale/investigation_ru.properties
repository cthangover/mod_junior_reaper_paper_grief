jrp/investigation/dispatch/ask = Межмировой портал · дело № 001
jrp/investigation/dispatch/go = В столицу: к пустующему посту стражника
jrp/investigation/dispatch/stay = Остаться в офисе
jrp/investigation/dispatch/registered = Диспетчер: Портал настроен на западные ворота столицы. Оттуда к старой мельнице. Обратный портал — у поста.
jrp/investigation/dispatch/unarmed = Стас: В графе «вооружение» опять прочерк?
jrp/investigation/dispatch/tools = Диспетчер: В графе «допуск к разговорам» ограничений нет.
jrp/investigation/dispatch/unbriefed = Диспетчер: Сначала получите поручение. Без номера дела вы просто гуляете в рабочее время.
jrp/investigation/dispatch/finished = Дело закрыто. Дорога в столицу остаётся открыта: можно проверить пост и поговорить с участниками.
jrp/investigation/dispatch/revisit = Вернуться в столицу
jrp/investigation/dispatch/done = Остаться в Бюро
jrp/investigation/gates/title = Столица · западный пост
jrp/investigation/gates/empty = В журнале караула — фамилия Глеба. В будке — остывшая кружка. У ворот никого.
jrp/investigation/gates/chat = [Чат игроков] Великий Герой: стражи нет. Можно вскрывать лавки, пока не вернулся.
jrp/investigation/gates/locals = Стас: А те, кто в лавках, знают, что у них сейчас «можно»?
jrp/investigation/gates/route = Осмотрите пустой пост. Дорога через переулок ведёт к мельнице; на рынке можно расспросить торговцев. Обратный переход в Бюро — у ворот.
jrp/investigation/post/log = Последняя запись: «Принял смену». Ни сдачи поста, ни разрешения отлучиться.
jrp/investigation/post/trail = За будкой — смятый бумажный свёрток и следы к узкому переулку. Дальше начинается дорога к старой мельнице.
jrp/investigation/post/sixth = Стас: Пятый труп. И ни одного вопроса, куда он уходит перед этим.
jrp/investigation/post/again = Следы ведут через переулок к старой мельнице. Глеб на пост не вернулся.
jrp/investigation/post/returned = После восстановления Глеб снова у ворот. Теперь можно спросить его самого.
jrp/investigation/post/secured = В книге караула появилась сдача смены. Глеб на посту, торговые ряды снова под защитой.
jrp/investigation/alley/wrapper = Свёрток пахнет дешёвым спиртным. На сургуче — клеймо рыночной лавки.
jrp/investigation/alley/footprints = Один след ведёт от рынка к мельнице. Обратного почти не видно.
jrp/investigation/alley/assumption = Стас: Пока это маршрут. Не причина смерти.
jrp/investigation/alley/again = Клеймо рыночной лавки, следы к мельнице. Показания торговца пригодятся, когда будет с чем спрашивать.
jrp/investigation/milldoor/first = Дверь приоткрыта. Внутри тот самый стражник из дела № 001.
jrp/investigation/milldoor/snapshot = Восстановленный стражник сейчас у ворот. Здесь доступен сохранённый слепок первого осмотра: он не меняет живого человека.
jrp/investigation/milldoor/view = Открыть материалы осмотра
jrp/investigation/milldoor/stay = Остаться во дворе
jrp/investigation/mill/title = Старая мельница · осмотр
jrp/investigation/mill/no_rush = Смерть: На этот вызов уже можно не спешить. На соседние — ещё можно.
jrp/investigation/mill/stay = Стас: Я осмотрю место. Тебя позову, когда будут факты.
jrp/investigation/mill/how = Осмотрите тело, бутылки и бумагу у стола. Подсвеченные предметы открываются щелчком; выход — у двери.
jrp/investigation/mill/repeat = Тело, бутылки и записка ещё на месте. В журнал попадёт каждая осмотренная улика.
jrp/investigation/mill/archive = Сохранённый слепок осмотра до восстановления. Изображение тела — материал дела; живой Глеб находится у ворот.
jrp/investigation/body/marks = Порезов и следов борьбы нет. Оружие в ножнах. Под ладонью — пятно рвоты.
jrp/investigation/body/cause = Стас: Не похоже на бой. Запишу признаки, а не готовый диагноз.
jrp/investigation/body/record = В дело внесено: внешних ран нет; возможна интоксикация. Нужно сопоставить с остальными находками.
jrp/investigation/bottles/labels = Пустые бутылки из одной рыночной лавки. На двух пробках — разные даты, с разницей в день.
jrp/investigation/bottles/tally = На обороте чека два столбика покупок. Суммы меньше, чем стоила бы одна ночь в таверне.
jrp/investigation/bottles/days = Стас: Пришёл сюда не на один вечер. Дешевле пить без свидетелей.
jrp/investigation/note/page = Половина судебного уведомления. Читаются слова «содержание ребёнка» и «удержание из жалованья». Подпись оторвана.
jrp/investigation/note/message = На обороте детским почерком: «Папа, ты придёшь?» Дата затёрта.
jrp/investigation/note/not_verdict = Стас: Не буду складывать из половины листа целого виноватого. Сначала спрошу живых.
jrp/investigation/clues/complete = Три находки зафиксированы. Теперь — в Бюро, к рабочему столу Стаса: запросить восстановление Глеба, сохранив материалы осмотра.
jrp/investigation/clue_body/again = Внешних ран нет. Признаки возможной интоксикации записаны в деле.
jrp/investigation/clue_bottles/again = Рыночное клеймо, две даты покупок, дешёвое спиртное. Чек сохранён в деле.
jrp/investigation/clue_note/again = Судебное уведомление об удержаниях и детская записка внесены в дело. Их ещё надо проверить у свидетелей.
jrp/investigation/millexit/reset = Стас: Теперь можно просить восстановление. Доказательства останутся в деле.
jrp/investigation/millexit/office = Вернуться в Бюро через служебный портал
jrp/investigation/millexit/yard = Выйти во двор мельницы
jrp/investigation/return/office = Пройти через портал в Бюро Некроуслуг
jrp/investigation/return/stay = Остаться в столице
jrp/investigation/desk/file = Дело № 001. Один и тот же стражник, пять смертей. Место обнаружения — старая мельница. Причина во всех пяти актах: «уточняется».
jrp/investigation/desk/columns = Стас: Добавлю столбец «что мы вообще знаем». Пока пустой.
jrp/investigation/desk/route = Для выезда выйдите из кабинета Смерти в коридор и подойдите к стойке диспетчерской. В столице начните с пустого поста; к мельнице ведёт переулок.
jrp/investigation/desk/again = Для восстановления нужны три зафиксированные улики с мельницы: тело, бутылки и бумага у стола. Маршрут в столицу — через Бюро выездов.
jrp/investigation/desk/reset_summary = На столе сходятся три записи: ран нет, спиртное куплено на рынке, в кармане — уведомление об алиментах. Пока это рабочая версия.
jrp/investigation/desk/reset_ask = Восстановить Глеба для опроса? Материалы осмотра и весь прогресс дела сохранятся.
jrp/investigation/desk/reset_confirm = Восстановить только стражника. Сохранить улики
jrp/investigation/desk/reset_later = Сначала перечитать материалы
jrp/investigation/desk/retained = Тело без следов боя. Две даты на бутылках. Судебное удержание и детская записка. Следующий шаг — разговор с живым стражником.
jrp/investigation/desk/reset_death = Смерть: Восстановила. Глеб у западных ворот. Если спросит, откуда ты всё знаешь, покажи служебный допуск, а не его некролог.
jrp/investigation/desk/reset_memory = Стас: У него память осталась?
jrp/investigation/desk/reset_scope = Смерть: До прошлого вечера. У тебя — все записи. Даже те, которые начальству лучше не читать.
jrp/investigation/desk/reset_done = Восстановление завершено. Улики сохранены, меч остаётся изъятым. Вернитесь к Глебу у столичных ворот.
jrp/investigation/desk/interviews = В деле не хватает живых показаний. Коллеги Глеба — у ворот, продавец — на рынке, Лида — дома за рынком. Отдельно проследите за Глебом из укрытия во дворе мельницы.
jrp/investigation/desk/ask_guard = Глеб восстановлен и находится у ворот. Начните с разговора с ним; не стоит выдавать догадку за признание.
jrp/investigation/desk/propose = Причина подтверждена показаниями и наблюдением. Вернитесь к Глебу: предложите прямые выплаты на сына, трезвую встречу и подмену на время разговора.
jrp/investigation/desk/wife_pending = Глеб согласился на условия. Теперь нужно согласие Лиды: встреча без опьянения, при свидетеле, выплаты отдельно от общения с ребёнком.
jrp/investigation/desk/guard_pending = Лида согласилась на первую встречу. Передайте условия Глебу у ворот и убедитесь, что он остаётся на посту.
jrp/investigation/report/supervisor = Начальник: По вашему участку смертность упала. Это не то, на что мы выделяли штатную единицу. Жду объяснительную.
jrp/investigation/report/no_extra = Стас: Одна живая смена — и уже перерасход показателей.
jrp/investigation/report/ask = Как оформить результат дела?
jrp/investigation/report/mask = Провести повторные записи как исправление дублей учёта
jrp/investigation/report/later = Отложить отправку и сверить материалы
jrp/investigation/report/review = Глеб на посту. Отпуск спиртного в долг прекращён по его просьбе. Выплаты сыну отделены от встреч. Можно отправлять отчёт.
jrp/investigation/report/sent = В отчёте: «Повторные записи устранены в рамках сверки реестра. Прогноз нагрузки без изменений». Причины живого человека в таблицу не попали.
jrp/investigation/report/death = Смерть: Впервые за неделю пейджер молчит.
jrp/investigation/report/coffee = Стас: Кофе успеем?
jrp/investigation/report/five = Смерть: Пять минут. И никаких показателей.
jrp/investigation/report/closed = Дело № 001 закрыто. Глеб жив и на посту. С Лидой согласованы условия первой встречи с сыном. В Бюро отправлен отчёт о сверке реестра.
jrp/investigation/desk/finished = Дело № 001 закрыто. Отчёт отправлен один раз; исправленные дубли не превращаются в новые смерти. У кофейного столика ждёт свободных пять минут.
jrp/investigation/guard/dismiss = Глеб: По службе — к старшему. Обо мне — ни к кому.
jrp/investigation/guard/not_yet = Стас: Ладно. Сначала соберу то, что можно проверить без твоего согласия.
jrp/investigation/guard/question = Стас: Глеб? Я из Бюро. Почему ты уходишь к мельнице?
jrp/investigation/guard/refusal = Глеб: Я стою на посту. Ты видел, чтобы я уходил?
jrp/investigation/guard/records = Стас: Я видел пять актов.
jrp/investigation/guard/not_talking = Глеб: Вот с актами и разговаривай.
jrp/investigation/guard/next = Глеб не отвечает. Можно опросить его коллег у ворот, торговца на рынке и Лиду в доме за рынком — в любом порядке. Наблюдать за его уходом удобнее из укрытия во дворе мельницы.
jrp/investigation/guard/facts = Стас: Два дня у мельницы. Рыночное спиртное. Весь остаток жалованья. Лида подтвердила: ты перестал платить на Мишу.
jrp/investigation/guard/motive = Глеб: Она забрала сына. Я решил — от меня ей больше ничего. Пусть хоть казначейство подавится.
jrp/investigation/guard/son = Стас: Деньги забирает лавочник. Без денег остаётся Миша. А твою смену закрывают люди, которых потом убивают у лавок.
jrp/investigation/guard/silence = Глеб разжимает пальцы. На ладони отпечатался ремень от ножен.
jrp/investigation/guard/choice = Что предложить Глебу?
jrp/investigation/guard/plan = Выплаты отдельно. Трезвая встреча с сыном при свидетеле
jrp/investigation/guard/think = Пока не предлагать решение
jrp/investigation/guard/boundary = Глеб: Она меня к нему не пустит.
jrp/investigation/guard/consent = Стас: Спросим. Её согласие — не моя подпись. С твоей стороны нужны выплаты и трезвость. Сейчас, а не после встречи.
jrp/investigation/guard/accept = Глеб: Удержание пусть идёт. И скажи лавочнику — больше мне в долг не давать. Без жалоб, я сам прошу.
jrp/investigation/guard/credit = Старший забирает подписанную Глебом записку лавочнику и передаёт посыльному. Это просьба самого покупателя, а не запрет Бюро.
jrp/investigation/guard/visit_wife = Глеб согласился на условия. Передайте их Лиде в доме за рынком; решение о первой встрече остаётся за ней.
jrp/investigation/guard/later = Глеб снова берётся за ремень. Разговор можно продолжить, когда Стас будет готов предложить условия.
jrp/investigation/guard/waiting = Глеб: Я сказал — удержание оставьте. Но не обещай Мише, пока с Лидой не поговоришь.
jrp/investigation/guard/final_stas = Стас: В воскресенье после смены. Во дворе, при твоём старшем. Только трезвым. Выплаты идут независимо от встречи.
jrp/investigation/guard/final_guard = Глеб: Понял. Смену сдам по книге. Мельница подождёт.
jrp/investigation/guard/chat = [Чат игроков] Великий Герой: стража вернулась. Лавки снова не трогаются. Ну и скукота.
jrp/investigation/guard/report = Глеб остался на посту. Вернитесь в Бюро и отправьте итоговый отчёт с рабочего стола Стаса.
jrp/investigation/guard/reformed = Глеб: Пост принят. До сдачи смены никуда не уйду. Мише скажи… Нет. Сам скажу в воскресенье.
jrp/investigation/guard/missing = Глеб не вернулся. Сначала нужно осмотреть мельницу и восстановить стражника через Бюро.
jrp/investigation/colleagues/shift = Старший караула: Глеб раньше за двоих стоял. Потом стал просить смены без жалованья. Казначейство отказало — он начал пропадать.
jrp/investigation/colleagues/alimony = Стас: В деле удержание на ребёнка.
jrp/investigation/colleagues/separation = Старший: Разошлись они с Лидой. Он пил, приходил ночью. Она перестала пускать к Мише. Он решил пропить всё, что остаётся после удержаний.
jrp/investigation/colleagues/cover = Старший: На посту одному его не держим из жалости. Нас самих сократили. Но полчаса на трезвый разговор с сыном я прикрою. Вне смены.
jrp/investigation/colleagues/record = Записано: семейный конфликт, попытка пропить остаток жалованья, готовность старшего помочь со встречей. Слова коллег ещё нужно сверить с торговцем и Лидой.
jrp/investigation/colleagues/again = Старший: На встрече могу быть свидетелем. Дежурство бросать ради неё не надо: сначала сдать смену по книге.
jrp/investigation/colleagues/early = Старший: Его нашли у мельницы. Разговаривать сейчас не с кем. Восстановишь — сначала спроси его самого; за спиной напраслину разводить не стану.
jrp/investigation/merchant/seal = Стас: Это ваше клеймо на бутылках с мельницы?
jrp/investigation/merchant/price = Лавочник: Моё. У меня за ту же монету втрое больше, чем в таверне. Без музыки и скамьи. Глеб за скамью платить не хотел.
jrp/investigation/merchant/dates = Стас: Брал два дня подряд?
jrp/investigation/merchant/credit = Лавочник: Утром и вечером. В долг всё просит: жалованье у него с удержанием. До дома не доходит, тащит к старой мельнице.
jrp/investigation/merchant/request = Лавочник: Попросит больше не отпускать ему в долг — запишу. Сам попросит. Твоего служебного вида для этого мало.
jrp/investigation/merchant/record = Записано: Глеб покупает на рынке, потому что здесь дешевле таверны; два дня подряд пьёт у мельницы. Покупать спиртное для расследования не требуется.
jrp/investigation/merchant/again = Лавочник: Лидина дверь за торговыми рядами. Но если за правдой — стучись без бутылки.
jrp/investigation/merchant/stop_credit = Лавочник вычёркивает Глеба из долговой книги: «По просьбе покупателя». Новую бутылку Стасу не предлагают.
jrp/investigation/merchant/early = Лавочник: Пробки мои. Но о покупателях — после разговора с самим покупателем. Ты пока даже имени у него не спросил.
jrp/investigation/wifedoor/early = За дверью: «Если от Глеба — сначала поговорите с ним. Я больше не буду отвечать вместо него». Сначала восстановите стражника и попробуйте расспросить.
jrp/investigation/wifehouse/title = Дом Лиды
jrp/investigation/wifehouse/entry = Лида оставляет дверь приоткрытой. Из соседней комнаты слышно, как ребёнок считает вслух.
jrp/investigation/wifehouse/how = Поговорите с Лидой щелчком по зоне разговора. Выход возвращает на рынок.
jrp/investigation/wifehouse/returning = Лида ждёт у стола. Миша остался в соседней комнате.
jrp/investigation/wife/open = Стас: Я разбираю исчезновения Глеба. Нашёл уведомление об удержании и записку Миши.
jrp/investigation/wife/child = Лида: Записку я не передавала. Миша сам сунул ему в карман на последней встрече.
jrp/investigation/wife/reason = Лида: Он приходил пьяным. Один раз повёл сына через весь город искать открытую таверну. Я перестала их отпускать вдвоём. Потом Глеб перестал приносить деньги.
jrp/investigation/wife/court = Стас: Удержание уже идёт через казначейство?
jrp/investigation/wife/motive = Лида: То, что успевают удержать. Остальное он пропивает, чтобы мне не досталось. Как будто Мишу тоже можно вычеркнуть вместе со мной.
jrp/investigation/wife/boundaries = Лида: Сына я от него не прячу. Но трезвый день, при человеке, которому Миша доверяет. И выплаты не в обмен на свидание с ребёнком.
jrp/investigation/wife/record = Условия Лиды записаны: трезвая встреча при свидетеле, после смены; содержание сына независимо от общения. Сверьте показания коллег и торговца, понаблюдайте у мельницы, затем вернитесь к Глебу.
jrp/investigation/wife/offer = Стас: Глеб согласился оставить удержание и попросил больше не давать ему в долг. Старший готов быть рядом на первой встрече, после сдачи смены.
jrp/investigation/wife/ask = Как передать предложение?
jrp/investigation/wife/agree = Зафиксировать условия Лиды. Решение о встрече остаётся за ней
jrp/investigation/wife/later = Сначала уточнить детали у Глеба
jrp/investigation/wife/consent = Лида: В воскресенье, во дворе. Час. Миша сам решит, сколько захочет разговаривать. При запахе спиртного встреча закончится.
jrp/investigation/wife/not_bargain = Стас: И ни одна выплата от этой встречи не зависит.
jrp/investigation/wife/yes = Лида: Вот это запиши первым.
jrp/investigation/wife/final = Лида согласилась на первую встречу при своих условиях. Передайте их Глебу у западных ворот; он должен оставаться на службе до сдачи смены.
jrp/investigation/wife/late = Лида: Тогда не обещай ему за меня. Я подожду конкретного ответа.
jrp/investigation/wife/agreed = Лида: Воскресенье, двор, старший рядом. И пусть Миша увидит отца, а не очередное обещание.
jrp/investigation/wife/early = Лида: Если о Глебе — сначала спросите Глеба. Я не его переводчик.
jrp/investigation/observe/ask = Наблюдать за дорогой к мельнице, не показываясь Глебу? В деле пройдут два игровых дня.
jrp/investigation/observe/watch = Остаться в укрытии и проследить за Глебом
jrp/investigation/observe/later = Пока уйти
jrp/investigation/observe/day1 = Первый день. Глеб покидает пост после полудня. С рынка несёт свёрток, в таверну не заходит. К вечеру у мельницы остаются две пустые бутылки.
jrp/investigation/observe/night = Ночью он не возвращается. У ворот Великий Герой выбивает витрину. Торговец зовёт стражу, которой нет.
jrp/investigation/observe/day2 = Второй день. Ещё одна покупка на рынке. Глеб садится у двери мельницы. Когда пытается встать, ноги перестают держать.
jrp/investigation/observe/help = Стас: Я вызвал помощь. Не ещё один акт — помощь.
jrp/investigation/observe/not_enough = Смерть: Вызов вижу. На этот раз снова поздно.
jrp/investigation/observe/proof = В дело попадает непрерывная запись двух дней: Глеб пьёт до интоксикации, остаётся без помощи и умирает. Нападения игроков на него не было.
jrp/investigation/observe/restore = Смерть: По твоей заявке верну его к смене ещё раз. Но причину ты уже видел. Одним восстановлением это не закрыть.
jrp/investigation/observe/next = Глеб восстановлен у ворот. Запись наблюдения сохранена. Опросите коллег, торговца и Лиду в любом порядке; затем предложите Глебу выход из этого круга.
jrp/investigation/observe/early = Наблюдать пока не за кем: сначала осмотрите мельницу, восстановите Глеба в Бюро и попробуйте поговорить с ним у ворот.
jrp/investigation/observe/again = Двухдневная запись уже в деле: рынок, мельница, интоксикация. Повторять чужую смерть ради второй копии записи Стас не собирается.
jrp/investigation/observe/resolved = Дорога пуста. Глеб остаётся у ворот до сдачи смены. Повторять наблюдение больше незачем.
jrp/investigation/coffee/offer = Стас: Я могу налить две чашки.
jrp/investigation/coffee/one = Смерть: Одну. Вторую я не успею.
jrp/investigation/coffee/leave = Стас оставляет чашку на свободном краю стола. Смерть забирает её, не выпуская пейджер.
jrp/investigation/coffee/no_sugar = Смерть: Без сахара. На будущее.
jrp/investigation/coffee/busy = На дисплее автомата: «Кофе есть». Пейджер Смерти настаивает на другом.
jrp/investigation/coffee/quiet = Смерть кладёт пейджер на край стола. Экран остаётся тёмным.
jrp/investigation/coffee/remember = Смерть: Я помню такую тишину. До Бюро.
jrp/investigation/coffee/dont_fill = Стас: Не будем её заполнять.
jrp/investigation/coffee/five = Пять минут никто ничего не заполняет.
jrp/investigation/coffee/after = Смерть: Если ещё останешься — налей себе. Это уже твой перерыв.
jrp/investigation/quest/guard/name = Дело № 001 · Живой на посту
jrp/investigation/quest/guard/0 = Поручение получено. Прочитайте материалы за временным столом в кабинете Смерти. Затем выйдите в коридор Бюро и оформите выезд у диспетчерской. Глеб найден мёртвым у старой мельницы.
jrp/investigation/quest/guard/1 = Осмотрите пустой пост у западных ворот. Через переулок пройдите во двор старой мельницы и войдите внутрь. Обратный служебный переход в Бюро находится у ворот.
jrp/investigation/quest/guard/2 = Осмотрите мельницу щелчком по трём предметам: тело Глеба, бутылки и записка у стола. Выход — у двери. Каждая находка сохраняется отдельно.
jrp/investigation/quest/guard/3 = Осмотр не завершён. В деле должны быть все три находки: тело без следов боя, бутылки с рыночным клеймом и бумага об удержании на ребёнка. Можно вернуться за пропущенной уликой.
jrp/investigation/quest/guard/4 = Три улики зафиксированы. Вернитесь в Бюро через служебный переход и используйте рабочий стол Стаса: восстановите только Глеба, сохранив улики и прогресс расследования.
jrp/investigation/quest/guard/5 = Глеб восстановлен у западных ворот; материалы осмотра сохранены. Вернитесь в столицу через Бюро выездов и попробуйте расспросить самого стражника.
jrp/investigation/quest/guard/6 = Глеб отказался говорить. В любом порядке опросите коллег у ворот, продавца на рынке и Лиду в доме за рынком. Отдельно проследите за Глебом из укрытия во дворе мельницы — запись займёт два игровых дня без ожидания в реальном времени.
jrp/investigation/quest/guard/7 = Все показания и двухдневное наблюдение собраны. Глеб пропивает остаток жалованья после удержаний, пытаясь отомстить бывшей жене, и умирает от интоксикации. Вернитесь к нему и предложите прямые выплаты на сына, трезвую встречу при свидетеле и сдачу смены по книге.
jrp/investigation/quest/guard/8 = Глеб согласился на выплаты и попросил прекратить продажу ему в долг. Передайте предложение Лиде в доме за рынком. Её согласие на первую встречу нельзя подменить служебным решением.
jrp/investigation/quest/guard/9 = Лида согласилась на первую встречу в воскресенье во дворе, при старшем караула, только в трезвом состоянии. Выплаты не зависят от встречи. Передайте условия Глебу у западных ворот.
jrp/investigation/quest/guard/10 = Глеб жив, остаётся на посту и сдаёт смену по книге. Столица снова защищена. Вернитесь в Бюро к рабочему столу Стаса и оформите итоговый отчёт; начальство требует объяснить снижение смертности.
jrp/investigation/quest/guard/11 = Дело закрыто. Глеб жив и на посту. Выплаты и встреча с сыном согласованы; отчёт принят как исправление дублей. Стасу выдан личный кабинет: дверь дальше по коридору за кабинетом Смерти. У Смерти есть пять минут на кофе.
jrp/investigation/death_hint/first = Смерть: Если про косу — это рабочий инструмент. Меч тебе не вернут.
jrp/investigation/death_hint/ask_work = Спросить о первом деле
jrp/investigation/death_hint/ask_break = У тебя бывает перерыв?
jrp/investigation/death_hint/inspect = Смерть: Сначала посмотри на тело. И на всё, что рядом. Не пиши «нападение игроков», пока не увидишь следы. В прошлый раз так и сделали.
jrp/investigation/death_hint/break = Смерть: Был. Пока ты спрашивал.
jrp/investigation/death_hint/pager = Она переворачивает пейджер экраном вниз. Он продолжает мигать.
jrp/investigation/death_hint/finish = Смерть: Ты уже начал осмотр. Доведи его до конца: тело, бутылки и бумага у стола. Без трёх записей восстанавливать пока рано.
jrp/investigation/death_hint/reset = Смерть: Все три находки внесены? Тогда к временному столу. В заявке укажи: восстановить Глеба, материалы осмотра сохранить. Иначе начальник ещё попросит осмотреть его заново.
jrp/investigation/death_hint/question = Смерть: Глеб жив и у западных ворот. Теперь спроси его самого. Нет, я не могу заодно восстановить желание разговаривать.
jrp/investigation/death_hint/witnesses = Смерть: Отказ — тоже ответ, только пустой. Коллеги у ворот, лавочник на рынке, Лида дома за рядами. И укрытие во дворе мельницы: там можно увидеть, куда уходит его смена.
jrp/investigation/death_hint/offer = Смерть: Показания сходятся. Теперь нужен разговор с Глебом, а не ещё одна копия акта. Предложи выплаты на сына и трезвую встречу после смены, при свидетеле.
jrp/investigation/death_hint/wife = Смерть: Глеб согласился. Лида ещё нет. Её решение в твоих служебных полномочиях не записано — сходи и спроси.
jrp/investigation/death_hint/guard = Смерть: Условия согласованы. Передай их Глебу у ворот и проверь, что он сдаёт смену по книге. Потом вернёмся к отчёту.
jrp/investigation/death_hint/report = Смерть: Глеб на посту. Вызовов меньше. Начальник это заметит — отправь отчёт со своего стола, пока он не посчитал тишину недоработкой.
jrp/investigation/death_hint/quiet = Смерть: Пейджер молчит. Пять минут у кофейного столика — и ни одного вопроса про работу. С этим справишься?
