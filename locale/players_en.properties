jrp/players/guard/absent=Guard is gone. We can crack the shops before he gets back.
jrp/players/guard/oath=You are a paladin. You took an oath.
jrp/players/guard/loophole=The oath forbids looting in front of witnesses. I read the description.
jrp/players/guard/witness=Does the merchant count?
jrp/players/guard/interface=Only if he has a Report button.
jrp/players/notice/quest=Oh, a new NPC. No sword. Must start a quest chain.
jrp/players/notice/clothes=In those trousers? More likely closes one.
jrp/players/notice/listens=He is looking at us. Maybe he can hear us?
jrp/players/notice/safe=Keep it out of general chat and he will not hear.
jrp/players/notice/stayed=Still listening. I think we are the buttons in this dialogue.
jrp/players/notice/left=Gone. Did not even give us a reward for meeting him.
jrp/players/gear/wings=Can those wings actually fly?
jrp/players/gear/stats=No. Plus twelve to greatness.
jrp/players/gear/door=And minus one doorway in clearance.
jrp/players/gear/dragon=My set dropped from a dragon. Forty runs.
jrp/players/gear/credit=Mine dropped from my paycheck. One run, then a month without lunch.
jrp/players/clerk/form=Hey, you in the shirt! Where is security weakest?
jrp/players/clerk/check=First ask if he is security or the inspector.
jrp/players/clerk/report=Inspector. No weapon, see? Everyone ends up owing those people.
jrp/players/returned/guard=The guard is back. Shops are off, then?
jrp/players/returned/morals=I was testing the town security, actually.
jrp/players/returned/protocol=Then put the security back out of your backpack.
jrp/players/returned/leave=Let us go find a boss. At least it knows why we hit it.
jrp/players/mill/plan=They raised the flour quota. Forgot to tell the river.
jrp/players/mill/safety=I handle the sacks. The sign handles safety.
jrp/players/mill/visitor=Here for work? Careful, then. That is the most dangerous thing here.
