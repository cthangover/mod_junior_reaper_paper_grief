jrp/bureau/object/personal_desk=Личный рабочий стол Стаса
jrp/bureau/intro/seat=Смерть: Пока садись за маленький стол. Картотека общая. Мою стопку с пейджером не трогай.
jrp/bureau/intro/temporary=Стас: А отдельный кабинет?
jrp/bureau/intro/first_case=Смерть: После первого закрытого дела. Если поставлю тебе ещё и шкаф, я отсюда не выйду.
jrp/bureau/award/order=Начальник, по громкой связи: Дело принято. Сотруднику выделить отдельный кабинет. Мебель — по описи.
jrp/bureau/award/stas=Стас: То есть испытательный срок закончился?
jrp/bureau/award/death=Смерть: Нет. Просто я теперь могу дойти до картотеки.
jrp/bureau/award/route=Личный кабинет Стаса открыт. Его дверь — дальше по коридору Бюро, за кабинетом Смерти.
jrp/bureau/door/locked=На служебном пропуске: «Рабочее место — кабинет Смерти. Отдельный кабинет после первого закрытого дела». Дверь пока опломбирована.
jrp/bureau/personal/title=Личный кабинет · принят по описи
jrp/bureau/personal/stas=Стас: Один стол. Один шкаф. Уже можно не согласовывать, где лежит дело.
jrp/bureau/personal/inventory=В описи против кресла стоит: «Скрип допустимый». Стас подписывает.
jrp/bureau/personal/desk=На своём столе Стас раскладывает закрытое дело Глеба. Улики и показания остаются в папке; новая обложка не превращает их в новое поручение.
jrp/bureau/personal/quiet=Стас: Следующее дело начну с разговора. Таблицу успею.
jrp/bureau/confiscation=Меч лежит под пломбой Бюро. Квитанция действительна; статус Избранного по-прежнему не подтверждён.
