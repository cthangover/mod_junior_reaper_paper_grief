jrp/arrival/title = Lunch break
jrp/arrival/1 = Stas: One more cell, then lunch.
jrp/arrival/2 = Colleague: You are already eating.
jrp/arrival/3 = Stas: That is a parallel task.
jrp/arrival/4 = A chicken bone. The breath never came. The spreadsheet stayed open.
jrp/arrival/title2 = New world. Equipment issue
jrp/arrival/5 = Voice: Welcome to a world of sword and sorcery. Here is your starter sword.
jrp/arrival/6 = Stas: So I died. Can I start over here?
jrp/arrival/7 = Death: Hand over the sword. Database error. You are not the Chosen One.
jrp/arrival/8 = Stas: Then who am I?
jrp/arrival/9 = Death: Junior Reanimation Manager. Keep the receipt.
jrp/arrival/10 = Stas: Is there a probation period?
jrp/arrival/11 = Death: It has already started. Follow me to the office.
jrp/office/1 = Supervisor, over the intercom: A new employee? Excellent. Case 001: repeated deaths of a capital guard.
jrp/office/2 = Stas: I have not filled out an application yet.
jrp/office/3 = Supervisor: Backdate it. The capital is a safe zone. Guards are not supposed to die there. Find out why.
jrp/office/4 = Death: They have found him by the old mill five times now. He never makes it back to the gate.
jrp/office/5 = Stas: And nobody has replaced him?
jrp/office/6 = Death: The living guard is the protection. When he is gone, players can hurt the locals. Then I have to collect them.
jrp/office/7 = Stas: How many people are in your department?
jrp/office/8 = Death: In the field? One. Feel free to count.
jrp/office/9 = The first case is in your bag. Read the papers at your desk; dispatch to the mill is across the office.
jrp/office/controls = Move with WASD or the arrow keys. Face an object or colleague and press E or F to interact.
jrp/office/title = Bureau of Necroservices
jrp/death/opt_work = Ask about the guard
jrp/death/opt_time = Do you ever get a break?
jrp/death/2 = Death: Look at the body first. Do not write down a player attack until you see evidence. That is what they did last time.
jrp/death/5 = Death: I did. While you were asking.
jrp/death/6 = She turns her pager face down. It keeps flashing.
jrp/death/1 = Death: If this is about the scythe, it is a work tool. You are not getting the sword back.
jrp/death/3 = Stas: Five identical rows are not proof.
jrp/death/4 = Death: Start with that.
jrp/desk/1 = Case 001. The same guard, five deaths. Location: the old mill. Cause in all five reports: pending.
jrp/desk/2 = Stas: I will add a column for what we actually know. Empty so far.
jrp/desk/3 = Field objective: inspect the body, establish the cause of death and find out why the post is empty. The dispatch counter is in the east wing.
jrp/desk/4 = Stas: The mill first. I can finish the spreadsheet when I have facts.
jrp/evidence/1 = The receipt reads: one starter sword. Confiscated following a change of career path.
jrp/evidence/2 = Stas: What if I appeal?
jrp/evidence/3 = A voice inside the drawer replies: the appeals window closes upon employment.
jrp/coffee/1 = Stas: I could pour two cups.
jrp/coffee/2 = Death: One. I will not have time for the second.
jrp/coffee/3 = Stas leaves a cup on the clear edge of the desk. Death takes it without letting go of her pager.
jrp/coffee/4 = Death: No sugar. For future reference.
jrp/coffee/5 = Machine: coffee depleted. Consumption report ready.
jrp/dispatch/go = Register the field assignment
jrp/dispatch/stay = Look around the office first
jrp/dispatch/1 = Dispatcher: The mill. Repeated guard death. Marking the weapons field with a dash.
jrp/dispatch/2 = Stas: At least I have a case.
jrp/dispatch/3 = Death: Keep it dry. The mill roof leaks.
jrp/dispatch/end = Field assignment registered
jrp/dispatch/scope = End of the opening prototype. The prologue, office and first assignment are playable. The mill inspection and investigation belong to the continuation; for now, you can stay and explore the office.
jrp/dispatch/after = The assignment to the old mill is registered. The case remains open: the investigation is not part of this prototype yet.
jrp/dispatch/unbriefed = Dispatcher: Get an assignment first. Without a case number, you are just wandering during office hours.
jrp/dispatch/ask = Dispatch for case 001: the old mill
